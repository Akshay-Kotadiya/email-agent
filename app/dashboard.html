<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Email Agent</title><style>body{font:16px system-ui;max-width:1100px;margin:40px auto;padding:0 20px;background:#f6f7f9}h1{color:#172033}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:18px;margin:12px 0}.badge{padding:4px 8px;border-radius:12px;background:#e8eefc}.suspicious{background:#ffe2e2}.promotion{background:#fff1c7}button{padding:8px 12px;margin:6px 6px 0 0;border:0;border-radius:7px;background:#2463eb;color:white;cursor:pointer}textarea{width:100%;min-height:90px;margin-top:10px}</style></head><body><h1>Email Agent</h1><p>Approval-first Gmail queue. Suspicious mail is never replied to; promotion deletion is disabled by default.</p><main id="queue">Loading…</main><script>async function load(){const r=await fetch('/api/emails');const root=document.querySelector('#queue');root.innerHTML=r.items.map(e=>`<section class="card ${e.classification}"><strong>${e.subject}</strong><br><small>${e.sender} · trust ${e.trust_score}/100 · importance ${e.importance_score}/100</small><p>${e.preview}</p><span class="badge">${e.classification}</span><p>${e.reason||''}</p>${e.classification==='suspicious'?'<b>Flagged: no reply or notification action will send.</b>':`<button onclick="draft('${e.id}')">Generate draft</button><div id="d-${e.id}"></div>`}</section>`).join('')}async function draft(id){const r=await fetch('/api/emails/'+id+'/draft',{method:'POST'});const e=await r.json();document.querySelector('#d-'+id).innerHTML=`<textarea id="t-${id}">${e.reply_draft||''}</textarea><br><button onclick="approve('${id}')">Approve and queue send</button>`}async function approve(id){const draft=document.querySelector('#t-'+id).value;const r=await fetch('/api/emails/'+id+'/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({draft})});alert((await r.json()).message||'Done')}load()</script></body></html>
